[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "PLC", "PLE", "RUF"]
ignore = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "F841", "F401", "N803", "E501", "E402", "N802", "N806", "N817", "SIM105"]
"app/shared/response_handler/responseSchema.py" = ["N999"]
"app/tasks/email_tasks.py" = ["E501"]
"app/integration/langGraph/*.py" = ["N999", "E501"]
"app/modules/auth/*.py" = ["N999"]
"app/modules/interview/InterviewModel.py" = ["E402", "F821", "UP042", "N999"]
"app/modules/interviewTopics/*.py" = ["N999"]
"app/modules/interviewQuestions/*.py" = ["N999"]
"app/modules/user/*.py" = ["N999"]
"app/integration/langGraph/interviewPrompt.py" = ["RUF001", "W293"]
"app/integration/transcription/utils.py" = ["RUF001"]
"app/integration/pdf/service.py" = ["N806", "RUF003", "E501", "SIM108"]
"app/integration/transcription/manager.py" = ["E501"]
"app/modules/user/UserModel.py" = ["F821"]
"app/shared/exceptions/base_exception.py" = ["N818"]
"app/shared/db/status_updater.py" = ["SIM108"]
"app/integration/langGraph/concurrency.py" = ["RUF012"]
"app/integration/langGraph/logger_decorator.py" = ["RUF005"]
"app/integration/langGraph/interviewGraph.py" = ["SIM102"]
"app/modules/files/schema.py" = ["UP042"]
"app/core/config.py" = ["N802"]
"app/core/security.py" = ["N802"]
"alembic/versions/*.py" = ["E501", "W291", "UP035", "UP007", "I001"]
"app/celery_app.py" = ["E501"]
"app/integration/langGraph/Schema/commonSchema.py" = ["RUF002", "UP042"]
"app/integration/ffmpeg/utils.py" = ["N806", "RUF002"]
"app/integration/ffmpeg/manager.py" = ["F811"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["tests/"]
